<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Messages</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f6f9ff;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #1264e8;
            margin-bottom: 20px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 22px rgba(17, 24, 39, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: top;
        }

        th {
            background: #eef5ff;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            color: #6b7280;
            text-align: center;
            padding: 20px;
        }

        .nav {
            margin-top: 20px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .nav a {
            color: #1264e8;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Contact Messages</h1>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Message</th>
                        <th>Created</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="messagesTableBody"></tbody>
            </table>
            <div id="emptyState" class="empty" style="display:none;">No contact messages found.</div>
        </div>

        <div class="nav">
            <a href="/">Home</a>
            <a href="/admin.html">Order Admin</a>
        </div>
    </div>

    <script>
        async function loadMessages() {
            const body = document.getElementById('messagesTableBody');
            const empty = document.getElementById('emptyState');

            try {
                const res = await fetch('/api/contact-messages');
                const messages = await res.json();

                if (!Array.isArray(messages) || messages.length === 0) {
                    empty.style.display = 'block';
                    body.innerHTML = '';
                    return;
                }

                empty.style.display = 'none';
                body.innerHTML = messages.map(msg => `
          <tr>
            <td>${msg.id}</td>
            <td>${msg.name || '-'}</td>
            <td>${msg.email || '-'}</td>
            <td>${msg.phone || '-'}</td>
            <td>${msg.message || '-'}</td>
            <td>${msg.created_at ? new Date(msg.created_at).toLocaleString() : '-'}</td>
            <td>
              <button class="delete-btn" data-id="${msg.id}">Delete</button>
            </td>
          </tr>
        `).join('');

                document.querySelectorAll('.delete-btn').forEach(button => {
                    button.addEventListener('click', async function () {
                        const id = this.getAttribute('data-id');
                        const res = await fetch('/api/contact-messages/' + id, { method: 'DELETE' });
                        const result = await res.json();

                        if (result.success) {
                            loadMessages();
                        } else {
                            alert(result.message || 'Failed to delete message.');
                        }
                    });
                });
            } catch (error) {
                body.innerHTML = '<tr><td colspan="7" class="empty">Failed to load messages.</td></tr>';
            }
        }

        loadMessages();
    </script>
</body>

</html>
